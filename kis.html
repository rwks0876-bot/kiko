<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد سعيد راندا</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
        }

        /* شاشة المفاجأة الأولية */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: 0.8s ease-in-out;
        }

        #overlay h1 {
            font-size: 2.5rem;
            color: #4a90e2;
            margin-bottom: 20px;
        }

        .gift-box {
            font-size: 100px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-30px);}
            60% {transform: translateY(-15px);}
        }

        .gift-box:hover {
            transform: scale(1.2);
        }

        /* محتوى الكارت */
        #content {
            display: none;
            text-align: center;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            max-width: 500px;
            width: 90%;
            opacity: 0;
            transform: translateY(50px);
            transition: 1s ease-out;
        }

        h2 {
            font-size: 3rem;
            color: #2d3436;
            margin-bottom: 10px;
            font-weight: 900;
        }

        p {
            font-size: 1.4rem;
            line-height: 1.8;
            color: #636e72;
        }

        .highlight {
            color: #e84393;
            font-weight: bold;
        }

        /* تأثيرات إضافية */
        .balloons {
            position: absolute;
            bottom: -100px;
            font-size: 30px;
            animation: fly 8s linear infinite;
        }

        @keyframes fly {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>هناك مفاجأة لكِ.. 🎉</h1>
        <div class="gift-box" onclick="startCelebration()">🎁</div>
        <p>اضغطي على الهدية</p>
    </div>

    <div id="content">
        <h2>راندا ✨</h2>
        <p>كل عام وأنتِ بخير يا أحلى بنت!</p>
        <p>بمناسبة يوم ميلادك، أتمنى لكِ سنة مليئة <br>بالسعادة والنجاح والتوفيق.</p>
        <p class="highlight">يوم ميلاد سعيد لأعز صديقة! 🎈</p>
    </div>

    <script>
        function startCelebration() {
            // إخفاء شاشة البداية
            const overlay = document.getElementById('overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 800);

            // إظهار المحتوى
            const content = document.getElementById('content');
            content.style.display = 'block';
            setTimeout(() => {
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 100);

            // إطلاق الألعاب النارية (Fireworks effect)
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              // الألعاب النارية من اليمين واليسار
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            // إضافة بالونات طائرة في الخلفية
            setInterval(createBalloon, 700);
        }

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.className = 'balloons';
            balloon.innerText = ['🎈', '✨', '🌸', '🎊'][Math.floor(Math.random() * 4)];
            balloon.style.left = Math.random() * 100 + 'vw';
            balloon.style.animationDuration = (Math.random() * 3 + 5) + 's';
            document.body.appendChild(balloon);
            setTimeout(() => balloon.remove(), 8000);
        }
    </script>
</body>
</html>
