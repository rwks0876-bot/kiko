<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مفاجأة راندا 🎉</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Tajawal", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      overflow: hidden;
    }/* شاشة البداية */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
}

.hidden {
  display: none;
}

.btn {
  margin-top: 30px;
  padding: 14px 28px;
  font-size: 1.1rem;
  border: none;
  border-radius: 999px;
  background: linear-gradient(90deg, #ff9a9e, #fad0c4);
  color: #1a1a1a;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4);
}

/* نصوص */
h1 {
  font-size: clamp(2rem, 5vw, 3.2rem);
  margin: 0 0 10px;
  letter-spacing: 0.5px;
}

h2 {
  font-size: clamp(1.4rem, 4vw, 2rem);
  font-weight: 400;
  opacity: 0.9;
}

.card {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 24px;
  padding: 32px 28px;
  max-width: 520px;
  backdrop-filter: blur(10px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
  animation: pop 0.8s ease forwards;
}

@keyframes pop {
  from {
    transform: scale(0.85) translateY(20px);
    opacity: 0;
  }
  to {
    transform: scale(1) translateY(0);
    opacity: 1;
  }
}

/* الألعاب النارية */
canvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* كونفيتي */
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  opacity: 0.9;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
  }
}

/* بيت الشعر */
.poem {
  margin-top: 18px;
  padding-top: 12px;
  border-top: 1px dashed rgba(255,255,255,0.25);
  font-size: 1.05rem;
  line-height: 1.9;
  opacity: 0.95;
}
.poem .line { display: block; }

/* مسرح الإيموجي */
.emoji-stage {
  position: relative;
  margin-top: 18px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-size: 1.6rem;
}

/* ثعابين ترقص */
.snake {
  display: inline-block;
  animation: dance 1.2s ease-in-out infinite;
  transform-origin: 50% 80%;
}
.snake:nth-child(1) { animation-delay: 0s; }
.snake:nth-child(3) { animation-delay: .2s; }

@keyframes dance {
  0% { transform: translateY(0) rotate(0deg) scale(1); }
  25% { transform: translateY(-6px) rotate(-10deg) scale(1.05); }
  50% { transform: translateY(0) rotate(0deg) scale(1); }
  75% { transform: translateY(-6px) rotate(10deg) scale(1.05); }
  100% { transform: translateY(0) rotate(0deg) scale(1); }
}

/* فراشات تطير */
.butterfly {
  position: absolute;
  bottom: 0;
  animation: fly 5s linear infinite;
}
.butterfly:nth-child(4) { left: 10%; animation-delay: 0s; }
.butterfly:nth-child(5) { left: 80%; animation-delay: 1.2s; }

@keyframes fly {
  0% { transform: translateY(0) translateX(0) scale(1) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  50% { transform: translateY(-40px) translateX(20px) scale(1.1) rotate(5deg); }
  100% { transform: translateY(-80px) translateX(-20px) scale(1) rotate(-5deg); opacity: 0; }
}

/* هدية نابضة */
.gift {
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

footer { {
  position: absolute;
  bottom: 16px;
  width: 100%;
  text-align: center;
  font-size: 0.9rem;
  opacity: 0.6;
}

  </style>
</head>
<body>
  <canvas id="fireworks"></canvas>  <!-- شاشة البداية -->  <div id="startScreen" class="screen">
    <div class="card">
      <h1>في مفاجأة 🎁</h1>
      <h2>اضغطي الزر واستمتعي</h2>
      <button class="btn" id="startBtn">ابدأ المفاجأة 🎉</button>
    </div>
  </div>  <!-- شاشة التهنئة -->  <div id="greetScreen" class="screen hidden">
    <div class="card">
      <h1>🎉 كل عام وأنتِ بخير يا راندا 🎉</h1>
      <h2>
        عيد ميلاد سعيد 🎂✨
        <br /><br />
        أتمنى لك سنة مليئة بالفرح والنجاح والضحكة الحلوة اللي تميّزك.
        <br />
        تستاهلين كل شيء جميل في الدنيا.
      </h2><!-- بيت شعر جاهلي فخم -->
  <div class="poem">
    <span class="line">وما نيلُ المطالبِ بالتمنّي ✨</span>
    <span class="line">ولكن تُؤخذُ الدنيا غِلابا</span>
  </div>

  <!-- رموز متحركة: ثعابين ترقص + فراشات تطير + هدية -->
  <div class="emoji-stage">
    <span class="snake">🐍</span>
    <span class="gift">🎁</span>
    <span class="snake">🐍</span>
    <span class="butterfly">🦋</span>
    <span class="butterfly">🦋</span>
  </div>
</div>

  </div>  <footer>صُمم خصيصًا لراندا — 2026</footer>  <script>
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // ألعاب نارية بسيطة
    let particles = [];
    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createFirework(x, y) {
      const count = 80;
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: Math.cos((Math.PI * 2 * i) / count) * random(1, 5),
          vy: Math.sin((Math.PI * 2 * i) / count) * random(1, 5),
          alpha: 1,
          radius: random(1, 3),
        });
      }
    }

    function animateFireworks() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.02; // جاذبية بسيطة
        p.alpha -= 0.01;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      });

      particles.forEach((p) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 200, 200, ${p.alpha})`;
        ctx.fill();
      });

      requestAnimationFrame(animateFireworks);
    }
    animateFireworks();

    // كونفيتي
    function launchConfetti() {
      for (let i = 0; i < 120; i++) {
        const conf = document.createElement("div");
        conf.className = "confetti";
        conf.style.left = Math.random() * 100 + "vw";
        conf.style.top = "-10px";
        conf.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
        conf.style.animationDuration = 3 + Math.random() * 3 + "s";
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 6000);
      }
    }

    const startBtn = document.getElementById("startBtn");
    const startScreen = document.getElementById("startScreen");
    const greetScreen = document.getElementById("greetScreen");

    startBtn.addEventListener("click", () => {
      // ألعاب نارية في البداية
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          createFirework(random(100, w - 100), random(100, h - 200));
        }, i * 400);
      }

      // بعد ثواني يظهر الكلام والحفل
      setTimeout(() => {
        startScreen.classList.add("hidden");
        greetScreen.classList.remove("hidden");
        launchConfetti();
      }, 2500);
    });
  </script></body>
</html>
