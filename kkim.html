<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عيد ميلاد راندا 🎉</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff66cc;
            --gold: #ffcc00;
            --bg-dark: #0a0a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
            text-align: center;
            line-height: 1.4;
        }

        /* مراحل الموقع */
        .stage {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.8s ease;
            z-index: 10;
            padding: 20px;
        }

        /* المرحلة 1: العد التنازلي السريع */
        #countdown-stage { background: radial-gradient(circle, #1a1a3a, #0a0a1a); z-index: 30; }
        
        .count-num {
            font-size: 8rem;
            font-weight: 800;
            color: var(--gold);
            text-shadow: 0 0 30px var(--gold);
            animation: pulse 1s infinite;
        }

        /* المرحلة 2: الألعاب النارية */
        #fireworks-stage { background: #000; z-index: 20; display: none; }

        /* المرحلة 3: الحفل الرئيسي */
        #party-stage { 
            position: relative; 
            display: none; 
            overflow-y: auto; 
            background: linear-gradient(to bottom, #0a0a1a, #1a0a2a);
        }

        .hero-title {
            font-size: 2.5rem;
            color: var(--gold);
            margin-top: 40px;
            animation: float 3s ease-in-out infinite;
        }

        .name-sparkle {
            font-size: 3.5rem;
            color: var(--primary-pink);
            display: block;
            text-shadow: 0 0 15px var(--primary-pink);
            margin: 10px 0;
        }

        /* الفراشات */
        .butterfly {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 100;
            transition: transform 0.1s linear;
        }

        /* البطاقات المحسنة للجوال */
        .cards-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin: 30px auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .card i { font-size: 2rem; color: var(--gold); margin-bottom: 10px; }

        /* الرسوم المتحركة */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* الألعاب النارية (Canvas) */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* تعديلات الجوال */
        @media (max-width: 480px) {
            .hero-title { font-size: 1.8rem; }
            .name-sparkle { font-size: 2.8rem; }
            .card { margin: 0 10px; }
        }
    </style>
</head>
<body onclick="createHeart(event)">

    <section class="stage" id="countdown-stage">
        <h2 style="margin-bottom: 20px; color: #ccbbff;">استعدي يا راندا...</h2>
        <div class="count-num" id="timer">3</div>
    </section>

    <section class="stage" id="fireworks-stage">
        <canvas id="fireworksCanvas"></canvas>
        <h1 style="font-size: 3rem; color: white; text-shadow: 0 0 20px #ff3366;">🎆 مفاجأة! 🎇</h1>
    </section>

    <section class="stage" id="party-stage">
        <div style="width: 100%; padding-bottom: 50px;">
            <h1 class="hero-title">عيد ميلاد سعيد</h1>
            <span class="name-sparkle">راندا ✨</span>
            
            <p style="padding: 0 20px; font-size: 1.2rem; color: #ccddff;">
                كل عام وأنتِ بقلب أبيض وروح جميلة! 🌸
            </p>

            <div class="cards-container">
                <div class="card">
                    <i class="fas fa-crown"></i>
                    <h3>الملكة</h3>
                    <p>اليوم هو يومك الخاص لتتألقي.</p>
                </div>
                <div class="card">
                    <i class="fas fa-magic"></i>
                    <h3>سحر الصداقة</h3>
                    <p>وجودك يضيف لمسة سحرية لكل مكان.</p>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <p>اضغطي في أي مكان على الشاشة 👆</p>
                <div style="font-size: 2rem; margin-top: 20px;">🎉🎂🎈🎁</div>
            </div>
        </div>
    </section>

    <audio id="bg-music" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-happy-birthday-to-you-443.mp3" type="audio/mpeg">
    </audio>

    <script>
        const timerEl = document.getElementById('timer');
        const stages = {
            count: document.getElementById('countdown-stage'),
            fire: document.getElementById('fireworks-stage'),
            party: document.getElementById('party-stage')
        };

        // 1. العد التنازلي السريع
        let timeLeft = 3;
        const countInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                timerEl.innerText = timeLeft;
            } else {
                clearInterval(countInterval);
                goToFireworks();
            }
        }, 1000);

        // 2. مرحلة الألعاب النارية
        function goToFireworks() {
            stages.count.style.opacity = '0';
            setTimeout(() => {
                stages.count.style.display = 'none';
                stages.fire.style.display = 'flex';
                stages.fire.style.opacity = '1';
                initFireworks();
                
                // الانتقال للحفل بعد 3 ثواني من الألعاب النارية
                setTimeout(goToParty, 3500);
            }, 800);
        }

        // 3. الحفل الرئيسي
        function goToParty() {
            stages.fire.style.opacity = '0';
            setTimeout(() => {
                stages.fire.style.display = 'none';
                stages.party.style.display = 'block';
                stages.party.style.opacity = '1';
                document.getElementById('bg-music').play();
                startButterflies();
            }, 800);
        }

        // تأثير الفراشات
        function startButterflies() {
            const icons = ['🦋', '✨', '🌸'];
            setInterval(() => {
                const b = document.createElement('div');
                b.className = 'butterfly';
                b.innerText = icons[Math.floor(Math.random() * icons.length)];
                b.style.left = '-50px';
                b.style.top = Math.random() * window.innerHeight + 'px';
                document.body.appendChild(b);

                let posX = -50;
                let posY = parseFloat(b.style.top);
                let angle = 0;

                const move = setInterval(() => {
                    posX += 2;
                    angle += 0.1;
                    b.style.left = posX + 'px';
                    b.style.top = (posY + Math.sin(angle) * 20) + 'px';
                    
                    if (posX > window.innerWidth + 50) {
                        clearInterval(move);
                        b.remove();
                    }
                }, 20);
            }, 1500);
        }

        // تفاعل النقر (قلوب)
        function createHeart(e) {
            const heart = document.createElement('div');
            heart.innerHTML = '💖';
            heart.style.position = 'fixed';
            heart.style.left = e.clientX + 'px';
            heart.style.top = e.clientY + 'px';
            heart.style.pointerEvents = 'none';
            heart.style.fontSize = '20px';
            heart.style.transition = 'all 1s ease';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.style.transform = `translateY(-100px) scale(2)`;
                heart.style.opacity = '0';
            }, 10);
            setTimeout(() => heart.remove(), 1000);
        }

        // نظام الألعاب النارية المبسط (Canvas)
        function initFireworks() {
            const canvas = document.getElementById('fireworksCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            function createParticle() {
                return {
                    x: Math.random() * canvas.width,
                    y: canvas.height,
                    vx: Math.random() * 4 - 2,
                    vy: Math.random() * -10 - 5,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    size: Math.random() * 3 + 2
                };
            }

            function animate() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                if (particles.length < 50) particles.push(createParticle());

                particles.forEach((p, i) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.15;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    if (p.y > canvas.height) particles.splice(i, 1);
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
